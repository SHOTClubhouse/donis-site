<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Screen · Donis London 26</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/assets/brand/shot-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/donis.css">
<link rel="stylesheet" href="/assets/css/pages.css">
<style>
  html, body { height: 100%; overflow: hidden; cursor: none; }
  body::before { opacity: .04; }
  .tv { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.5vh 3vw; gap: 2.5vh; }
  .tv__head { display: flex; align-items: center; gap: 2vw; border-bottom: 1px solid var(--line-strong); padding-bottom: 2vh; }
  .tv__head img { height: 5.5vh; width: auto; }
  .tv__title { font-family: var(--f-display); font-size: 5vh; text-transform: uppercase; line-height: 1; }
  .tv__title em { font-style: normal; color: var(--orange); }
  .tv__head .tag--live { font-size: 2vh; padding: 1vh 1.2vw; }
  .tv__clock { margin-left: auto; font: 4.5vh var(--f-mono); }
  .tv__main { display: grid; grid-template-columns: 3fr 2fr; gap: 3vw; min-height: 0; align-content: start; }
  .tv__champ { grid-column: 1 / -1; border: 2px solid var(--acid); background: rgba(43,240,58,.07); padding: 2.5vh 2vw; display: grid; gap: 1vh; }
  .tv__champ .mono { color: var(--acid); font-size: 2.2vh; letter-spacing: .2em; }
  .tv__champ b { font-size: 9vh; line-height: .9; font-weight: 400; }
  .tvg { border: 1px solid var(--line-strong); background: var(--panel); padding: 1.6vh 1.5vw; margin-bottom: 1.6vh; display: grid; gap: .8vh; }
  .tvg--live { border-color: var(--acid); box-shadow: inset 6px 0 0 var(--acid); }
  .tvg--scheduled { opacity: .75; }
  .tvg__meta { font-size: 2vh; color: var(--mute); }
  .tvg__meta b { color: var(--acid); }
  .tvg__line { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vw; }
  .tvg__line > b { font-family: var(--f-display); font-weight: 400; font-size: 5vh; line-height: 1; text-transform: uppercase; }
  .tvg__line > b:last-child { text-align: right; }
  .tvg__line > b.win { color: var(--acid); }
  .tvg__line > b.lose { color: #ff4d4d; }
  .tvg__score { font-family: var(--f-display); font-size: 6.5vh; line-height: 1; }
  .tvg__score i { font-style: normal; color: var(--mute); padding: 0 .6vw; }
  .tvg .tbc, .tvlt .tbc { color: #6a6762; }
  .tvlt { font-size: 2.6vh; }
  .tvlt th, .tvlt td { padding: 2vh 1vw; }
  .tvlt tbody th { font-size: 3.6vh; }
  .tvlt thead th { font-size: 1.8vh; }
  .tvgroups { display: grid; grid-template-columns: repeat(var(--g, 1), minmax(0, 1fr)); gap: 1.5vw; }
  .tvgroups .lt__group { display: block; font-size: 1.8vh; margin-bottom: .8vh; }
  .tvgroups[style*="--g:2"] .tvlt { font-size: 2vh; }
  .tvgroups[style*="--g:2"] .tvlt th, .tvgroups[style*="--g:2"] .tvlt td { padding: 1.1vh .5vw; }
  .tvgroups[style*="--g:2"] .tvlt tbody th { font-size: 2.4vh; }
  /* Long team names stay on one line so six rows always fit. */
  .tvgroups .tvlt .lt__team { width: 100%; max-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tvlt tbody td:last-child b { font-size: 3.2vh; }
  .tvnext { border: 1px solid var(--line-strong); background: var(--panel); padding: 3vh 2vw; display: grid; gap: 1.5vh; }
  .tvnext .mono { font-size: 2vh; }
  .tvnext b { font-size: 6vh; font-weight: 400; line-height: 1; }
  .tvnext b i { font-style: normal; color: var(--mute); padding: 0 1.2vw; font-size: 4vh; }
  .tv__foot { display: flex; align-items: center; gap: 1.4vw; border-top: 1px solid var(--line-strong); padding-top: 2vh; }
  .tv__foot img.qr { height: 11vh; width: 11vh; background: var(--bone); padding: .8vh; }
  .tv__follow { display: grid; gap: .6vh; }
  .tv__follow .mono { font-size: 2vh; color: var(--mute); }
  .tv__follow b { font: 2.8vh var(--f-mono); color: var(--acid); }
  .tv__dots { margin-left: auto; display: flex; gap: .8vw; }
  .tv__dots i { width: 1.6vh; height: 1.6vh; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line-strong); }
  .tv__dots i.on { background: var(--acid); border-color: var(--acid); }
  .tv__shot { font-size: 2.2vh; color: var(--mute); display: flex; align-items: center; gap: 1vw; white-space: nowrap; }
  .tv__follow b { white-space: nowrap; }
  .tv__foot .tv__spx { flex-wrap: nowrap; }
  .tv__foot .spx__label { white-space: nowrap; }
  .tv__shot img { height: 7vh; width: auto; }
  .tv__spx { margin: 0 0 0 auto; padding: 0; border: 0; gap: 1vh 1.6vw; }
  .tv__spx .spx__label { font-size: 1.6vh; }
  .tv__spx .spx__word { font-size: 2.6vh; }
  .tv__spx .spx__logo { height: 6vh; }
  .tv__spx + .tv__dots { margin-left: 2vw; }
  .tv__stale { font: 2vh var(--f-mono); color: var(--ink); background: var(--orange); padding: 1vh 1.2vw; text-transform: uppercase; letter-spacing: .1em; }
  .tvvote { grid-column: 1 / -1; display: grid; grid-template-columns: 3fr 2fr; gap: 3vw; align-items: start; }
  .tvvote__list { display: grid; gap: 1.2vh; }
  .tvvote__row { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2vw; padding: 1.4vh 1.5vw; border: 1px solid var(--line-strong); background: var(--panel); }
  .tvvote__row.is-star { border-color: var(--acid); }
  .tvvote__bar { position: absolute; inset: 0 auto 0 0; background: rgba(43, 240, 58, .16); transition: width .8s ease; }
  .tvvote__who, .tvvote__pct { position: relative; }
  .tvvote__who b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 4.6vh; line-height: 1; text-transform: uppercase; }
  .tvvote__who small { font: 1.8vh var(--f-mono); color: var(--mute); text-transform: uppercase; letter-spacing: .1em; }
  .tvvote__pct { font-family: var(--f-display); font-size: 5vh; }
  .tvvote__pct small { display: block; font: 1.6vh var(--f-mono); color: var(--acid); text-align: right; letter-spacing: .1em; text-transform: uppercase; }
  .tvvote__side { border: 2px solid var(--acid); padding: 3vh 2vw; display: grid; gap: 2vh; justify-items: center; text-align: center; }
  .tvvote__side img { width: 30vh; height: 30vh; background: var(--bone); padding: 1.4vh; }
  .tvvote__side b { font-family: var(--f-display); font-weight: 400; font-size: 6vh; line-height: 1; text-transform: uppercase; }
  .tvvote__side .mono { font-size: 2.2vh; color: var(--acid); letter-spacing: .12em; text-transform: uppercase; }
  .tvvote__side p { margin: 0; font-size: 2.4vh; color: var(--bone); }
  /* Two group tables get half the screen so team names have room. */
  .tv__main--groups { grid-template-columns: 1fr 1fr; }
  /* Tighter spacing, used only when a slide would otherwise run into the footer. */
  .tv--tight .tvg { padding: 1vh 1.2vw; margin-bottom: 1vh; gap: .4vh; }
  .tv--tight .tvg__line > b { font-size: 4vh; }
  .tv--tight .tvg__score { font-size: 5vh; }
  .tv--tight .tv__champ { padding: 1.4vh 1.6vw; gap: .4vh; }
  .tv--tight .tv__champ b { font-size: 6vh; }
  .tv--tight .tvlt th, .tv--tight .tvlt td { padding: 1.1vh .8vw; }
  .tv--tight .tvlt tbody th { font-size: 2.8vh; }
  .tv--tight .tvvote__list { gap: .8vh; }
  .tv--tight .tvvote__row { padding: .8vh 1.2vw; }
  .tv--tight .tvvote__who b { font-size: 3.6vh; }
  .tv--tight .tvvote__pct { font-size: 4vh; }
  .tv--tight .tvvote__side { padding: 2vh 1.6vw; gap: 1.2vh; }
  .tv--tight .tvvote__side img { width: 24vh; height: 24vh; }
  .tv__fs { position: fixed; right: 2vw; bottom: 16vh; font: 1.8vh var(--f-mono); color: var(--ink); background: var(--bone); padding: 1vh 1.2vw; text-transform: uppercase; letter-spacing: .12em; cursor: pointer; z-index: 5; }
</style>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/standings.js" defer></script>
<script src="/assets/js/fixtures-model.js" defer></script>
<script src="/assets/js/screen.js" defer></script>
<script src="/assets/js/extras.js" defer></script>
</head>
<body>
<button class="tv__fs" type="button" data-fs hidden>Click for full screen</button>
<div class="tv">
  <header class="tv__head">
    <img src="/assets/brand/donis-wordmark-white.png" alt="Donis">
    <span class="tv__title">London 26 · <em data-div-name></em></span>
    <span class="tag tag--live" data-live hidden>Live</span>
    <span class="tag tag--orange tv__streampill" data-stream-pill hidden>Streaming live · scan to watch</span>
    <span class="tv__stale" data-stale hidden></span>
    <span class="tv__clock" data-clock></span>
  </header>
  <main class="tv__main">
    <div class="tv__champ" data-champ hidden></div>
    <div data-games></div>
    <div data-table></div>
    <div class="tvvote" data-vote hidden></div>
  </main>
  <footer class="tv__foot">
    <img class="qr" src="/assets/img/qr-games.png" alt="QR code for live scores" onerror="this.hidden=true">
    <div class="tv__follow"><span class="mono">Follow every score on your phone</span><b>donis.shotclubhouse.com/london-26/games</b></div>
    <div class="spx tv__spx" data-sponsor-strip hidden></div>
    <div class="tv__dots" data-dots></div>
    <span class="mono tv__shot">Powered by <img src="/assets/brand/shot-logo.png" alt="SHOT"></span>
  </footer>
</div>
</body>
</html>
